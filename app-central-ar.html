<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central Ar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-styles">
:root{
  --navy-900:#0F2A52;
  --navy-700:#1B4A82;
  --navy-100:#E7EDF6;
  --paper:#F5F7FB;
  --surface:#FFFFFF;
  --line:#E1E7EF;
  --ink:#13203A;
  --ink-soft:#5C6B84;
  --success:#1E9E6B;
  --success-soft:#E1F5EC;
  --danger:#D24B3F;
  --danger-soft:#FBE7E4;
  --amber:#C6821F;
  --amber-soft:#FBF0DC;
  --sidebar-ink:#EFF3F7;
  --sidebar-ink-soft:#9FB0C8;
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:20px;
  --shadow:0 1px 2px rgba(15,42,82,0.06), 0 8px 24px -12px rgba(15,42,82,0.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A121D;
    --surface:#121C2C;
    --line:#223046;
    --ink:#E7EDF3;
    --ink-soft:#8FA0B3;
    --navy-700:#2E5C9E;
    --navy-100:rgba(46,92,158,0.18);
    --success:#33C08A;
    --success-soft:rgba(51,192,138,0.14);
    --danger:#E8695C;
    --danger-soft:rgba(232,105,92,0.14);
    --amber:#E8B04C;
    --amber-soft:rgba(232,176,76,0.14);
    --shadow:0 1px 2px rgba(0,0,0,0.35), 0 8px 24px -12px rgba(0,0,0,0.55);
  }
}
:root[data-theme="dark"]{
  --paper:#0A121D;
  --surface:#121C2C;
  --line:#223046;
  --ink:#E7EDF3;
  --ink-soft:#8FA0B3;
  --navy-700:#2E5C9E;
  --navy-100:rgba(46,92,158,0.18);
  --success:#33C08A;
  --success-soft:rgba(51,192,138,0.14);
  --danger:#E8695C;
  --danger-soft:rgba(232,105,92,0.14);
  --amber:#E8B04C;
  --amber-soft:rgba(232,176,76,0.14);
  --shadow:0 1px 2px rgba(0,0,0,0.35), 0 8px 24px -12px rgba(0,0,0,0.55);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);min-height:100vh;}
::selection{background:var(--navy-100);}
body,input,select,textarea,button{font-family:'Inter',system-ui,sans-serif;color:var(--ink);}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3,.display{font-family:'Poppins',system-ui,sans-serif;text-wrap:balance;}
.brand-font{font-family:'Baloo 2',system-ui,sans-serif;}
button{cursor:pointer;font:inherit;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--navy-700);outline-offset:1px;}
a{color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;max-width:100%;overflow-x:hidden;}
.mobile-topbar{display:none;}
.drawer-close-btn{display:none;}
.drawer-backdrop{display:none;}
.sidebar{background:var(--navy-900);color:var(--sidebar-ink);padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 26px;}
.brand-text{min-width:0;flex:1;}
.brand-name{font-family:'Poppins',sans-serif;font-size:15.5px;font-weight:700;line-height:1.2;word-break:break-word;}
.brand-slogan{font-size:10.5px;color:var(--sidebar-ink-soft);letter-spacing:.2px;line-height:1.3;word-break:break-word;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--sidebar-ink-soft);background:transparent;border:none;text-align:left;transition:background .15s,color .15s;}
.nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
.nav-item.active{background:#fff;color:var(--navy-900);font-weight:700;box-shadow:0 4px 14px -4px rgba(0,0,0,0.35);}
.nav-icon{width:18px;flex:none;display:inline-flex;align-items:center;justify-content:center;opacity:.9;}
.sidebar-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;color:var(--sidebar-ink-soft);border-top:1px solid rgba(255,255,255,0.1);padding-top:14px;display:flex;align-items:center;gap:6px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex:none;}
.sync-dot.off{background:var(--amber);}
.theme-toggle{margin-left:auto;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);color:#fff;border-radius:8px;width:28px;height:28px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.theme-toggle:hover{background:rgba(255,255,255,0.16);}

.main{padding:30px 36px 60px;max-width:1200px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
.page-head h1{font-size:25px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:10px;}
.page-head p{margin:0;color:var(--ink-soft);font-size:13.5px;max-width:56ch;}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;}
.btn:hover{border-color:var(--navy-700);}
.btn.primary{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}
.btn.primary:hover{background:var(--navy-700);}
.btn.navy{background:var(--navy-700);color:#fff;border-color:var(--navy-700);}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink-soft);}
.btn.ghost:hover{color:var(--ink);border-color:transparent;}
.btn.danger{color:var(--danger);}
.btn.danger-solid{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn.danger-solid:hover{background:#B93A2F;}
.btn.small{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-soft);}
.chip.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}

.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);}
.card h3{margin:0 0 4px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);}
.card .big{font-size:25px;font-weight:700;margin-top:6px;}
.card .sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

.section-title{font-size:15.5px;font-weight:700;margin:30px 0 12px;display:flex;align-items:center;gap:10px;}
.section-title .count{font-size:11.5px;font-weight:700;color:var(--navy-700);background:var(--navy-100);padding:2px 9px;border-radius:20px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);padding:0 12px 10px;font-weight:700;}
td{padding:12px;border-top:1px solid var(--line);vertical-align:middle;}
tr:hover td{background:var(--paper);}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:auto;box-shadow:var(--shadow);}
.table-wrap table{padding:4px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
.dot{width:7px;height:7px;border-radius:50%;flex:none;}
.amount-pos{color:var(--success);font-weight:700;}
.amount-neg{color:var(--danger);font-weight:700;}
.empty-state{padding:46px 20px;text-align:center;color:var(--ink-soft);}
.empty-state .display{font-size:18px;color:var(--ink);margin-bottom:6px;font-weight:700;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none;}
.icon-btn:hover{border-color:var(--navy-700);}

.search-input{width:100%;max-width:340px;padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;}
.search-input:focus{outline:2px solid var(--navy-700);outline-offset:1px;}

.overlay{position:fixed;inset:0;background:rgba(11,25,48,0.5);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;z-index:80;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:26px;width:100%;max-width:560px;box-shadow:0 24px 60px -20px rgba(0,0,0,0.4);}
.modal h2{margin:0 0 16px;font-size:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-size:16px;font-family:inherit;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--navy-700);outline-offset:1px;border-color:transparent;}
.field textarea{min-height:70px;resize:vertical;}
.date-input-wrap{position:relative;}
.date-input-wrap input[type="date"]{padding-right:40px;}
.date-input-wrap input[type="date"]::-webkit-calendar-picker-indicator{opacity:0;pointer-events:none;}
.date-icon-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--ink-soft);width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;}
.date-icon-btn:hover{background:var(--navy-100);color:var(--navy-700);}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-grid .span2{grid-column:1/-1;}
@media(max-width:600px){.field-grid{grid-template-columns:1fr;}}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

.tab-toggle{display:flex;flex-wrap:wrap;gap:6px;background:var(--line);padding:4px;border-radius:11px;width:max-content;max-width:100%;margin-bottom:16px;}
.tab-toggle button{padding:8px 16px;border:none;background:transparent;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-soft);}
.tab-toggle button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}

.hero-band{background:linear-gradient(135deg,var(--navy-900),var(--navy-700));border-radius:var(--radius-lg);padding:28px 28px 58px;color:#fff;position:relative;overflow:hidden;}
.hero-band::after{content:'';position:absolute;right:-34px;bottom:-46px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,0.07);}
.hero-band::before{content:'';position:absolute;left:40%;top:-60px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.05);}
.hero-greeting{font-size:24px;font-weight:700;position:relative;z-index:1;}
.hero-sub{font-size:13.5px;color:rgba(255,255,255,0.75);margin-top:4px;position:relative;z-index:1;}
.hero-overlap{margin-top:-40px;position:relative;z-index:2;}
.navy-card{background:linear-gradient(135deg,var(--navy-900),var(--navy-700));border-color:transparent;}
.navy-card h3{color:rgba(255,255,255,0.72) !important;}
.navy-card .sub{color:rgba(255,255,255,0.7) !important;}
.hidden{display:none !important;}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;}
@media(max-width:1000px){.two-col{grid-template-columns:1fr;}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 12px 30px -8px rgba(0,0,0,0.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

/* editor / draft builder */
.editor-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow);}
.item-row{display:grid;grid-template-columns:1fr 90px 120px 32px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.item-row:last-child{border-bottom:none;}
.item-row input,.item-row select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:16px;width:100%;}
.check-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
.check-item label{font-size:13.5px;font-weight:600;flex:1;}
.pill-toggle{display:flex;gap:6px;}
.pill-toggle button{padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--paper);font-size:12px;font-weight:700;color:var(--ink-soft);}
.pill-toggle button.ok.active{background:var(--success-soft);color:var(--success);border-color:var(--success);}
.pill-toggle button.bad.active{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px;}
.photo-thumb{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);}
.photo-thumb img{width:100%;height:110px;object-fit:cover;display:block;}
.photo-thumb input{border:none;border-top:1px solid var(--line);width:100%;padding:6px 8px;font-size:16px;background:transparent;}
.photo-thumb .rm{width:100%;padding:6px;font-size:11.5px;color:var(--danger);background:transparent;border:none;border-top:1px solid var(--line);}
.upload-box{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--ink-soft);font-size:13px;}
.signature-wrap{border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;}
#sig-canvas{width:100%;height:160px;display:block;cursor:crosshair;}

/* ---------- Mobile (gaveta + sem rolagem horizontal) ---------- */
@media(max-width:880px){
  html,body{overflow-x:hidden;width:100%;}
  .mobile-topbar{
    display:flex;align-items:center;gap:12px;
    position:fixed;top:0;left:0;right:0;height:56px;z-index:90;
    background:var(--navy-900);padding:0 8px 0 6px;
  }
  .hamburger-btn{background:transparent;border:none;color:#fff;width:42px;height:42px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .hamburger-btn:hover{background:rgba(255,255,255,0.1);}
  .mobile-topbar-brand{display:flex;align-items:center;gap:9px;color:#fff;min-width:0;overflow:hidden;}
  .mobile-topbar-brand .brand-name{font-size:14.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mobile-topbar-brand .brand-slogan{display:none;}

  .app{display:block;grid-template-columns:none;min-height:0;}
  .sidebar{
    position:fixed;top:0;left:0;height:100dvh;width:78vw;max-width:300px;
    transform:translateX(-100%);transition:transform .25s ease;z-index:110;
    box-shadow:0 0 40px rgba(0,0,0,0.3);
  }
  .sidebar.open{transform:translateX(0);}
  .drawer-close-btn{display:inline-flex;align-items:center;justify-content:center;position:absolute;top:16px;right:14px;width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.08);border:none;color:#fff;}
  .drawer-backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:105;}

  .main{padding:70px 16px 48px;max-width:100%;}
  .page-head{flex-direction:column;align-items:stretch;}
  .page-head .head-actions, .page-head > button{width:100%;}
  .grid.g4{grid-template-columns:repeat(2,1fr);}
  .grid.g3{grid-template-columns:1fr 1fr;}
  .hero-band{padding:24px 20px 52px;}
  .field-grid{grid-template-columns:1fr;}
  .item-row{grid-template-columns:1fr;gap:6px;padding:12px 0;}
  .item-row > *{width:100%;}
  /* o documento impresso (orçamento/relatório/checklist) NUNCA muda de layout por causa do tamanho da tela —
     tem que sair sempre igual, seja no celular ou no PC. No celular, o usuário arrasta/dá zoom pra ver tudo. */
  #print-root.show{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* tabelas viram cartões empilhados — nunca rolam para o lado */
  .table-wrap{overflow:visible;}
  .table-wrap table, .table-wrap thead, .table-wrap tbody, .table-wrap tr, .table-wrap th, .table-wrap td{display:block;width:100%;}
  .table-wrap thead{display:none;}
  .table-wrap tr{padding:12px 14px;border-top:1px solid var(--line);}
  .table-wrap tr:first-child{border-top:none;}
  .table-wrap td{border:none;padding:5px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;}
  .table-wrap td[data-label]::before{content:attr(data-label);font-weight:600;color:var(--ink-soft);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;flex:none;}
  .table-wrap td:not([data-label]){justify-content:flex-end;}
  .table-wrap .row-actions{justify-content:flex-end;flex:1;}
}
@media(max-width:420px){
  .grid.g4{grid-template-columns:1fr 1fr;}
  .grid.g3{grid-template-columns:1fr;}
}

/* print documents */
#print-root{display:none;}
#print-root.show{display:block;position:fixed;inset:0;background:#EAEDF1;z-index:300;overflow-y:auto;padding:18px 0 60px;}
.print-overlay-bar{max-width:800px;margin:0 auto 16px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.print-overlay-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:#13203A;}
.doc-sheet{background:#fff;color:#101B2B;max-width:800px;margin:0 auto;border-radius:0;overflow:hidden;position:relative;font-size:13.5px;}
.doc-head{position:relative;padding:30px 34px 22px;overflow:hidden;}
.doc-head::before{content:'';position:absolute;top:0;right:-40px;width:220px;height:170px;background:#0F2A52;clip-path:polygon(40% 0,100% 0,100% 100%,0 100%);}
.doc-head::after{content:'';position:absolute;top:0;right:60px;width:70px;height:170px;background:#1B4A82;clip-path:polygon(50% 0,100% 0,50% 100%,0 100%);opacity:.85;}
.doc-head-inner{position:relative;z-index:2;display:flex;align-items:center;gap:14px;}
.doc-logo{height:46px;width:auto;flex:none;}
.doc-brand-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;color:#0F2A52;}
.doc-brand-slogan{font-size:10.5px;color:#5B6B7D;letter-spacing:.3px;}
.doc-title{font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;text-align:center;margin:18px 0 4px;color:#0F2A52;}
.doc-subtitle{text-align:center;font-size:13px;font-weight:700;color:#1B4A82;text-transform:uppercase;letter-spacing:.5px;margin-bottom:18px;}
.doc-body{padding:0 34px;}
.doc-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;font-size:13px;}
.doc-meta div b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:#5B6B7D;margin-bottom:3px;}
.doc-items{margin:10px 0 18px;}
.doc-item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #E1E7EC;font-size:13.5px;}
.doc-item b{font-weight:700;}
.doc-total{display:flex;justify-content:space-between;font-size:17px;font-weight:700;padding:14px 0;border-top:2px solid #0F2A52;margin-top:6px;}
.doc-check-list{margin:8px 0 18px;}
.doc-check-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #E1E7EC;font-size:13px;}
.doc-photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 20px;}
.doc-photo{border:1px solid #E1E7EC;border-radius:8px;overflow:hidden;}
.doc-photo img{width:100%;height:170px;object-fit:cover;display:block;}
.doc-photo div{padding:6px 8px;font-size:11.5px;color:#5B6B7D;}
.doc-sign{display:flex;justify-content:space-between;gap:20px;margin:26px 0 10px;}

function createLocalDb(){
  const KEY = 'centralar_localdb_v1';
  let store = {};
  try{ store = JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ store = {}; }
  const listeners = {};
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
  function collOf(path){ return store[path] || (store[path]=[]); }
  function mkSnap(d){ return { id:d.id, exists:true, data:()=>({...d}), metadata:{fromCache:false,hasPendingWrites:false} }; }
  function missSnap(id){ return { id, exists:false, data:()=>undefined, metadata:{fromCache:false,hasPendingWrites:false} }; }
  function notify(path){
    const arr = collOf(path);
    (listeners[path]||new Set()).forEach(cb=>{
      cb({docs:arr.map(mkSnap), size:arr.length, empty:arr.length===0, docChanges:()=>[], metadata:{fromCache:false,hasPendingWrites:false}});
    });
  }
  function makeDocRef(path,id){
    return {
      id, path:path+'/'+id,
      async get(){ const d=collOf(path).find(x=>x.id===id); return d?mkSnap(d):missSnap(id); },
      async set(data){ const arr=collOf(path); const i=arr.findIndex(x=>x.id===id); const rec={id,...data}; if(i>=0)arr[i]=rec; else arr.push(rec); persist(); notify(path); },
      async update(data){ const arr=collOf(path); const i=arr.findIndex(x=>x.id===id); if(i<0){ arr.push({id,...data}); } else { arr[i]={...arr[i],...data}; } persist(); notify(path); },
      async delete(){ const arr=collOf(path); const i=arr.findIndex(x=>x.id===id); if(i>=0)arr.splice(i,1); persist(); notify(path); },
      onSnapshot(next){
        listeners[path]=listeners[path]||new Set(); listeners[path].add(next);
        Promise.resolve().then(()=>{ const d=collOf(path).find(x=>x.id===id); next(d?mkSnap(d):missSnap(id)); });
        return ()=>listeners[path].delete(next);
      },
      collection(sub){ return makeCollRef(path+'/'+id+'/'+sub); }
    };
  }
  function makeCollRef(path){
    return {
      path,
      doc(id){ return makeDocRef(path, id||uid()); },
      async add(data){ const id=uid(); await makeDocRef(path,id).set(data); return makeDocRef(path,id); },
      where(){ return this; }, orderBy(){ return this; }, limit(){ return this; },
      async get(){ const arr=collOf(path); return {docs:arr.map(mkSnap), size:arr.length, empty:arr.length===0, docChanges:()=>[], metadata:{fromCache:false,hasPendingWrites:false}}; },
      onSnapshot(next){
        listeners[path]=listeners[path]||new Set(); listeners[path].add(next);
        Promise.resolve().then(()=>notify(path));
        return ()=>listeners[path].delete(next);
      }
    };
  }
  return { doc:(p)=>{ const parts=p.split('/'); const id=parts.pop(); return makeDocRef(parts.join('/'),id); }, collection:(p)=>makeCollRef(p) };
}

/* ---------- Google Drive sync (opcional, usado quando não é aberto como Artifact) ---------- */
const SYNC_CONFIG = {clientId:'', fileId:'', connected:false};

let gdAccessToken = null;
const DRIVE_FILE_NAME = 'centralar-dados.json';

function loadGis(){
  return new Promise(resolve=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2) return resolve(true);
    let tries=0;
    const iv = setInterval(()=>{
      tries++;
      if(window.google && window.google.accounts && window.google.accounts.oauth2){ clearInterval(iv); resolve(true); }
      else if(tries>100){ clearInterval(iv); resolve(false); }
    },100);
  });
}
function gdRequestToken(interactive){
  return new Promise(async (resolve)=>{
    const ok = await loadGis();
    if(!ok || !SYNC_CONFIG.clientId) return resolve(null);
    try{
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: SYNC_CONFIG.clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (resp)=>{ resp && resp.access_token ? resolve(resp.access_token) : resolve(null); },
        error_callback: ()=> resolve(null)
      });
      tokenClient.requestAccessToken(interactive? {} : {prompt:'none'});
    }catch(e){ resolve(null); }
  });
}
async function gdFetch(url, opts={}){
  opts.headers = {...(opts.headers||{}), Authorization: 'Bearer '+gdAccessToken};
  const res = await fetch(url, opts);
  if(!res.ok){ const t = await res.text().catch(()=>''); throw new Error('Drive API '+res.status+': '+t); }
  return res;
}
function defaultDriveData(){
  const d = {}; COLLECTIONS.forEach(c=> d[c]=[]); d.meta = []; return d;
}
function persistGdConfig(){
  try{ localStorage.setItem('centralar_gd_config', JSON.stringify({clientId:SYNC_CONFIG.clientId, fileId:SYNC_CONFIG.fileId||''})); }catch(e){}
}
async function gdFindOrCreateFile(){
  if(SYNC_CONFIG.fileId){
    try{ await gdFetch(`https://www.googleapis.com/drive/v3/files/${SYNC_CONFIG.fileId}?fields=id`); return SYNC_CONFIG.fileId; }
    catch(e){ SYNC_CONFIG.fileId=''; }
  }
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const listRes = await gdFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const listJson = await listRes.json();
  if(listJson.files && listJson.files.length){
    SYNC_CONFIG.fileId = listJson.files[0].id;
  } else {
    const metadata = {name: DRIVE_FILE_NAME, mimeType:'application/json'};
    const boundary = 'centralar'+Math.random().toString(36).slice(2);
    const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(defaultDriveData())}\r\n--${boundary}--`;
    const createRes = await gdFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method:'POST', headers:{'Content-Type': `multipart/related; boundary=${boundary}`}, body
    });
    const createJson = await createRes.json();
    SYNC_CONFIG.fileId = createJson.id;
  }
  persistGdConfig();
  return SYNC_CONFIG.fileId;
}
async function gdReadData(){
  const res = await gdFetch(`https://www.googleapis.com/drive/v3/files/${SYNC_CONFIG.fileId}?alt=media`);
  const text = await res.text();
  try{ return text? JSON.parse(text) : defaultDriveData(); }catch(e){ return defaultDriveData(); }
}
async function gdWriteData(obj){
  await gdFetch(`https://www.googleapis.com/upload/drive/v3/files/${SYNC_CONFIG.fileId}?uploadType=media`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj)
  });
}
function createGoogleDriveDb(){
  let data = {};
  let writeTimer = null;
  const listeners = {};
  function collOf(path){ return data[path] || (data[path]=[]); }
  function mkSnap(d){ return {id:d.id, exists:true, data:()=>({...d}), metadata:{fromCache:false,hasPendingWrites:false}}; }
  function missSnap(id){ return {id, exists:false, data:()=>undefined, metadata:{fromCache:false,hasPendingWrites:false}}; }
  function notify(path){
    const arr = collOf(path).slice();
    (listeners[path]||new Set()).forEach(cb=> cb({docs:arr.map(mkSnap), size:arr.length, empty:arr.length===0, docChanges:()=>[], metadata:{fromCache:false,hasPendingWrites:false}}));
  }
  function scheduleWrite(){
    clearTimeout(writeTimer);
    writeTimer = setTimeout(async ()=>{ try{ await gdWriteData(data); }catch(e){ console.error('Falha ao gravar no Drive', e); } }, 800);
  }
  function makeDocRef(path,id){
    return {
      id, path:path+'/'+id,
      async get(){ const d=collOf(path).find(x=>x.id===id); return d?mkSnap(d):missSnap(id); },
      async set(body){ const arr=collOf(path); const i=arr.findIndex(x=>x.id===id); const rec={id,...body}; if(i>=0)arr[i]=rec; else arr.push(rec); notify(path); scheduleWrite(); },
      async update(body){ const arr=collOf(path); const i=arr.findIndex(x=>x.id===id); if(i<0){ arr.push({id,...body}); } else { arr[i]={...arr[i],...body}; } notify(path); scheduleWrite(); },
      async delete(){ const arr=collOf(path); const i=arr.findIndex(x=>x.id===id); if(i>=0)arr.splice(i,1); notify(path); scheduleWrite(); },
      onSnapshot(next){ listeners[path]=listeners[path]||new Set(); listeners[path].add(next); Promise.resolve().then(()=>{ const d=collOf(path).find(x=>x.id===id); next(d?mkSnap(d):missSnap(id)); }); return ()=>listeners[path].delete(next); },
      collection(sub){ return makeCollRef(path+'/'+id+'/'+sub); }
    };
  }
  function makeCollRef(path){
    return {
      path,
      doc(id){ return makeDocRef(path, id||uid()); },
      async add(body){ const id=uid(); await makeDocRef(path,id).set(body); return makeDocRef(path,id); },
      where(){return this;}, orderBy(){return this;}, limit(){return this;},
      async get(){ const arr=collOf(path); return {docs:arr.map(mkSnap), size:arr.length, empty:arr.length===0, docChanges:()=>[], metadata:{fromCache:false,hasPendingWrites:false}}; },
      onSnapshot(next){ listeners[path]=listeners[path]||new Set(); listeners[path].add(next); Promise.resolve().then(()=>notify(path)); return ()=>listeners[path].delete(next); }
    };
  }
  return {
    doc:(p)=>{ const parts=p.split('/'); const id=parts.pop(); return makeDocRef(parts.join('/'),id); },
    collection:(p)=>makeCollRef(p),
    _load(obj){ data = obj||{}; Object.keys(listeners).forEach(path=>notify(path)); },
    _pollStart(){
      setInterval(async ()=>{
        try{
          const fresh = await gdReadData();
          const freshStr = JSON.stringify(fresh);
          if(freshStr !== JSON.stringify(data)){ data = fresh; Object.keys(listeners).forEach(path=>notify(path)); }
        }catch(e){ /* falha transitória, tenta de novo no próximo ciclo */ }
      }, 25000);
    }
  };
}
async function connectGoogleDrive(clientId, interactive){
  SYNC_CONFIG.clientId = clientId;
  const token = await gdRequestToken(interactive);
  if(!token) return false;
  gdAccessToken = token;
  try{
    await gdFindOrCreateFile();
    const gdb = createGoogleDriveDb();
    const initial = await gdReadData();
    gdb._load(initial);
    gdb._pollStart();
    db = gdb;
    usingLocalFallback = false;
    SYNC_CONFIG.connected = true;
    persistGdConfig();
    return true;
  }catch(e){ console.error(e); return false; }
}

async function initDb(){
  let real = null;
  try{ real = (typeof window.claude!=='undefined' && window.claude.use) ? await window.claude.use('db') : null; }catch(e){ real = null; }
  const dot=document.getElementById('sync-dot'), label=document.getElementById('sync-label');
  if(real){
    db = real; usingLocalFallback = false; usingRealDb = true;
    label.textContent = 'Sincronizado';
  } else {
    let connected = false;
    if(SYNC_CONFIG.clientId && SYNC_CONFIG.fileId){
      connected = await connectGoogleDrive(SYNC_CONFIG.clientId, false);
    }
    if(connected){
      label.textContent = 'Sincronizado (Google Drive)';
    } else {
      db = createLocalDb(); usingLocalFallback = true;
      dot.classList.add('off');
      label.textContent = SYNC_CONFIG.clientId ? 'Toque em Configurações p/ reconectar' : 'Salvo neste aparelho';
    }
  }
  subscribeAll();
  await ensureSeed();
}

async function ensureSeed(){
  const metaRef = db.doc('meta/app');
  const snap = await metaRef.get();
  const meta = snap.exists ? snap.data() : {};
  const patch = {};
  if(!meta.empresa) patch.empresa = EMPRESA; else EMPRESA = {...EMPRESA, ...meta.empresa};
  renderBrand();
  if(!meta.nextBudgetNumber) patch.nextBudgetNumber = 1;
  if(!meta.seededCatalog){
    patch.seededCatalog = true;
    for(const s of SEED_SERVICES) await db.collection('services').add(s);
    for(const p of SEED_PRODUCTS) await db.collection('products').add(p);
    for(const m of SEED_MATERIALS) await db.collection('materials').add(m);
    for(const c of SEED_CATEGORIES) await db.collection('categories').add(c);
  }
  if(Object.keys(patch).length) await metaRef.set({...meta, ...patch});
}

async function nextBudgetNumber(){
  const metaRef = db.doc('meta/app');
  const snap = await metaRef.get();
  const meta = snap.exists ? snap.data() : {};
  const n = meta.nextBudgetNumber || 1;
  await metaRef.set({...meta, nextBudgetNumber:n+1});
  return n;
}

async function saveEmpresa(data){
  EMPRESA = {...EMPRESA, ...data};
  renderBrand();
  const metaRef = db.doc('meta/app');
  const snap = await metaRef.get();
  const meta = snap.exists ? snap.data() : {};
  await metaRef.set({...meta, empresa:EMPRESA});
}

function entityModalHtml(key, record){
  const cfg = ENTITY_CONFIG[key];
  const isEdit = !!record;
  record = record || {};
  return `
  <h2>${isEdit?'Editar':'Novo'} ${cfg.singular}</h2>
  <form data-form="entity" data-entity="${key}" data-id="${record.id||''}">
    <div class="field-grid">
    ${cfg.fields.map(f=>{
      const val = record[f.key]!==undefined? record[f.key]: '';
      if(f.type==='textarea') return `<div class="field span2"><label>${f.label}</label><textarea name="${f.key}">${escapeHtml(val)}</textarea></div>`;
      if(f.type==='select') return `<div class="field ${f.col===2?'span2':''}"><label>${f.label}</label><select name="${f.key}">${f.options.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select></div>`;
      return `<div class="field ${f.col===2?'span2':''}"><label>${f.label}</label><input name="${f.key}" type="${f.type}" ${f.type==='number'?'step="0.01"':''} ${f.required?'required':''} value="${escapeHtml(val)}" ${f.placeholder?`placeholder="${f.placeholder}"`:''}></div>`;
    }).join('')}
    </div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" data-action="close-modal">Cancelar</button>
      <button type="submit" class="btn primary">${isEdit?'Salvar':'Cadastrar'}</button>
    </div>
  </form>`;
}

async function handleEntityForm(form){
  const key = form.dataset.entity, id = form.dataset.id, cfg = ENTITY_CONFIG[key];
  const fd = new FormData(form);
  const data = {};
  cfg.fields.forEach(f=> data[f.key] = f.type==='number'? parseFloat(fd.get(f.key)||0) : (fd.get(f.key)||''));
  if(id) await db.collection(key).doc(id).update(data);
  else await db.collection(key).add(data);
  closeModal();
}

function renderPainel(){

  const txMes = STATE.transactions.filter(t=>(t.data||'').slice(0,7)===m);
  const entradas = txMes.filter(t=>t.tipo==='entrada').reduce((s,t)=>s+t.valor,0);
  const saidas = txMes.filter(t=>t.tipo==='saida').reduce((s,t)=>s+t.valor,0);
  const saldo = entradas - saidas;
  const vendasMes = STATE.sales.filter(s=>(s.data||'').slice(0,7)===m).reduce((s,v)=>s+(v.total||0),0);
  const orcAbertos = STATE.budgets.filter(b=>b.status==='Aberto').length;

  const today = todayStr();
  const tomorrow = todayStr(new Date(Date.now()+86400000));
  const proximos = STATE.appointments.filter(a=>a.data>=today && a.status!=='Cancelado' && a.status!=='Concluído').slice().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)).slice(0,6);

  const barMax = Math.max(entradas, saidas, 1);

  return `

function effectiveStatus(t){
  if(t.status==='Pendente' && t.data && t.data < todayStr()) return 'Vencido';
  return t.status || 'Pago';
}
function renderFinanceiro(){
  const m = uiState.finMonth || monthStr();
  const months = Array.from(new Set(STATE.transactions.map(t=>(t.data||'').slice(0,7))));
  if(!months.includes(monthStr())) months.push(monthStr());
  months.sort().reverse();

  let list = STATE.transactions.filter(t=>(t.data||'').slice(0,7)===m);
  const pagos = list.filter(t=>effectiveStatus(t)==='Pago');
  const recebido = pagos.filter(t=>t.tipo==='entrada').reduce((s,t)=>s+t.valor,0);
  const pago = pagos.filter(t=>t.tipo==='saida').reduce((s,t)=>s+t.valor,0);
  const aReceber = list.filter(t=>t.tipo==='entrada' && effectiveStatus(t)!=='Pago').reduce((s,t)=>s+t.valor,0);
  const aPagar = list.filter(t=>t.tipo==='saida' && effectiveStatus(t)!=='Pago').reduce((s,t)=>s+t.valor,0);
  if(uiState.finTipo!=='todos') list = list.filter(t=>t.tipo===uiState.finTipo);
  list = list.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  const rows = list.map(t=>`<tr>
    <td data-label="Data">${formatDateBR(t.data)}</td>
    <td data-label="Descrição">${escapeHtml(t.descricao||'—')}</td>

    <td data-label="Forma">${escapeHtml(t.formaPagamento||'—')}</td>
    <td data-label="Status">${statusPill(effectiveStatus(t))}</td>

      <button class="icon-btn" data-action="edit-tx" data-id="${t.id}">${editIcon}</button>

    </div></td>
  </tr>`).join('');

  return `
  <div class="page-head">

    <button class="btn primary" data-action="new-tx">+ Novo lançamento</button>

function newSaleDraft(){ return {clienteId:'', clienteNome:'', data:todayStr(), formaPagamento:'Pix', obs:'', itens:[], temDesconto:false, desconto:0}; }
function saleDraftFromReport(reportId){
  const r = STATE.serviceReports.find(x=>x.id===reportId);
  if(!r) return newSaleDraft();
  const itens = [
    ...r.itensPrevistos.filter(i=>i.checked).map(i=>({tipo:'servico', refId:'', nome:i.descricao, valorUnit:i.valor, qtd:1})),
    ...r.itensExtras.map(i=>({tipo:'servico', refId:'', nome:i.descricao, valorUnit:i.valor, qtd:1}))
  ];
  return {clienteId:r.clienteId||'', clienteNome:r.clienteNome||'', data:todayStr(), formaPagamento:(r.condicoes&&r.condicoes[0])||'Pix', obs:'Venda gerada a partir do relatório de serviço.', itens, temDesconto:false, desconto:0};
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 900;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.55));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function setupSignaturePad(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.strokeStyle = '#101B2B';
  if(checklistDraft && checklistDraft.assinaturaDataUrl){
    const img = new Image();
    img.onload = ()=> ctx.drawImage(img,0,0,canvas.width,canvas.height);
    img.src = checklistDraft.assinaturaDataUrl;
  }
  let drawing=false, last=null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches? e.touches[0]:e;
    return [(t.clientX-r.left)*(canvas.width/r.width), (t.clientY-r.top)*(canvas.height/r.height)];
  }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ if(!drawing) return; drawing=false; if(checklistDraft) checklistDraft.assinaturaDataUrl = canvas.toDataURL('image/png'); }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
}

      ${connected? `<button type="button" class="btn ghost" data-action="gd-disconnect">Desconectar</button>`:''}
    </div>
    <div class="sub" style="margin-top:8px;">${connected? '🟢 Conectado — sincronizando com seu Google Drive.' : '⚪ Não conectado — os dados ficam salvos só neste aparelho.'}</div>
  </div>`;
}

function docHead(title, subtitle){
  return `<div class="doc-head"><div class="doc-head-inner">${brandMarkHtml(46)}<div><div class="doc-brand-name">${escapeHtml(EMPRESA.nome)}</div><div class="doc-brand-slogan">${escapeHtml(EMPRESA.slogan)}</div></div></div></div>
  <div class="doc-title">${title}</div>${subtitle?`<div class="doc-subtitle">${subtitle}</div>`:''}`;
}
function docFoot(){
  return `<div class="doc-foot"><span>📍 ${escapeHtml(EMPRESA.endereco)}</span><span>📱 ${escapeHtml(EMPRESA.whatsapp1)} ${EMPRESA.whatsapp2?'/ '+escapeHtml(EMPRESA.whatsapp2):''}</span></div>`;
}
let currentPrintHtml = '', currentPrintTitle = '';
function printNow(html, title){
  currentPrintHtml = html; currentPrintTitle = title||'Documento';
  const root = document.getElementById('print-root');
  root.innerHTML = `
    <div class="print-overlay-bar no-print">
      <div class="print-overlay-title">${escapeHtml(title||'Documento')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" class="btn" data-action="trigger-print">🖨️ Imprimir</button>
        <button type="button" class="btn primary" data-action="download-print">⬇️ Baixar arquivo</button>
        <button type="button" class="btn ghost" data-action="close-print">✕ Fechar</button>
      </div>
    </div>
    <div class="doc-sheet">${html}</div>`;
  root.classList.add('show');
  window.scrollTo(0,0);
}
function buildStandaloneDoc(html, title){
  const styleEl = document.getElementById('app-styles');
  const styleContent = styleEl ? styleEl.innerHTML : '';
  const fontsLink = '<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">';
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">`+
    `<title>${escapeHtml(title||'Documento')}</title>${fontsLink}<style>${styleContent}\nhtml,body{overflow-x:auto !important;}\nbody{background:#fff;padding:20px 0;}</style></head>`+
    `<body><div class="doc-sheet">${html}</div></body></html>`;
}
async function downloadCurrentDoc(){
  if(!downloadsApi){ toast('Recurso de salvar arquivo indisponível aqui. Tente pelo navegador (fora do Claude).'); return; }
  const fullHtml = buildStandaloneDoc(currentPrintHtml, currentPrintTitle);
  const stripped = (currentPrintTitle||'documento').toLowerCase().normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]','g'),'');
  const slug = stripped.replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'') || 'documento';
  try{
    await downloadsApi.save({filename: slug+'.html', data: fullHtml});
    toast('Arquivo salvo! Abra-o e use Compartilhar → Imprimir/Salvar em PDF.');
  }catch(e){
    if(e && e.code==='declined') return;
    toast('Não foi possível salvar o arquivo agora.');
  }
}

function render(){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.tab===uiState.tab));
  const main = document.getElementById('main');
  if(uiState.tab==='painel') main.innerHTML = renderPainel();
  else if(uiState.tab==='financeiro') main.innerHTML = renderFinanceiro();
  else if(uiState.tab==='vendas') main.innerHTML = renderVendas();
  else if(uiState.tab==='agenda') main.innerHTML = renderAgenda();
  else if(uiState.tab==='orcamentos') main.innerHTML = renderOrcamentos();
  else if(uiState.tab==='relatorios') main.innerHTML = renderRelatorios();
  else if(uiState.tab==='config') main.innerHTML = renderConfig();
  else if(uiState.tab==='cadastros'){
    const chips = `<div class="chips">
      ${Object.keys(ENTITY_CONFIG).map(k=>`<button class="chip ${uiState.cadastroSub===k?'active':''}" data-action="set-sub" data-group="cadastroSub" data-v="${k}">${ENTITY_CONFIG[k].icon} ${ENTITY_CONFIG[k].title}</button>`).join('')}
    </div>`;
    main.innerHTML = chips + renderEntityList(uiState.cadastroSub);
  }
  if(uiState.tab==='relatorios' && uiState.reportSub==='checklist' && checklistDraft) setupSignaturePad();
}

   AÇÕES (delegação de eventos)
============================================================ */
document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  if(action==='set-tab'){ uiState.tab = btn.dataset.tab; budgetDraft=reportDraft=checklistDraft=photoDraft=saleDraft=null; editingDraft=false; closeDrawer(); render(); return; }
  if(action==='open-drawer'){ openDrawer(); return; }
  if(action==='close-drawer'){ closeDrawer(); return; }
  if(action==='close-print'){ const r=document.getElementById('print-root'); r.classList.remove('show'); r.innerHTML=''; return; }
  if(action==='trigger-print'){ try{ window.print(); }catch(e){ toast('Use o botão "Baixar arquivo" abaixo.'); } return; }
  if(action==='download-print'){ await downloadCurrentDoc(); return; }
  if(action==='set-sub'){ uiState[btn.dataset.group] = btn.dataset.v; render(); return; }
  if(action==='close-modal'){ closeModal(); return; }
  if(action==='toggle-theme'){ applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); return; }

  if(action==='pick-logo'){ document.getElementById('logo-file-input').click(); return; }
  if(action==='remove-logo'){ await saveEmpresa({logoDataUrl:''}); render(); return; }
  if(action==='gd-save-connect'){
    const cid = document.getElementById('gd-client-id').value.trim();
    if(!cid){ toast('Cole o Client ID primeiro.'); return; }
    toast('Conectando ao Google Drive...');
    const ok = await connectGoogleDrive(cid, true);
    if(ok){
      subscribeAll();
      await ensureSeed();
      document.getElementById('sync-dot').classList.remove('off');
      document.getElementById('sync-label').textContent = 'Sincronizado (Google Drive)';
      toast('Conectado ao Google Drive!');
    } else {
      toast('Não foi possível conectar. Confira o Client ID.');
    }
    render(); return;
  }
  if(action==='gd-disconnect'){
    SYNC_CONFIG.connected=false; SYNC_CONFIG.fileId=''; gdAccessToken=null;
    try{ localStorage.removeItem('centralar_gd_config'); }catch(e){}
    db = createLocalDb(); usingLocalFallback = true;
    subscribeAll();
    document.getElementById('sync-dot').classList.add('off');
    document.getElementById('sync-label').textContent = 'Salvo neste aparelho';
    toast('Desconectado do Google Drive.');
    render(); return;
  }

  // entidades
  if(action==='new-entity'){ openModal(entityModalHtml(btn.dataset.entity, null)); return; }
  if(action==='edit-entity'){ const rec = STATE[btn.dataset.entity].find(x=>x.id===btn.dataset.id); openModal(entityModalHtml(btn.dataset.entity, rec)); return; }
  if(action==='delete-entity'){ confirmDialog('Excluir este registro?', async ()=>{ await db.collection(btn.dataset.entity).doc(btn.dataset.id).delete(); }); return; }

  // financeiro
  if(action==='new-tx'){ openModal(txModalHtml(null)); bindTxToggle(); return; }
  if(action==='edit-tx'){ const rec = STATE.transactions.find(x=>x.id===btn.dataset.id); openModal(txModalHtml(rec)); bindTxToggle(); return; }
  if(action==='delete-tx'){ confirmDialog('Excluir este lançamento?', async ()=>{ await db.collection('transactions').doc(btn.dataset.id).delete(); }); return; }
  if(action==='fin-tipo'){ uiState.finTipo = btn.dataset.v; render(); return; }

  // vendas
  if(action==='new-sale'){ saleDraft = newSaleDraft(); editingDraft=true; render(); return; }
  if(action==='new-sale-from-report'){ openModal(saleFromReportModalHtml()); return; }
  if(action==='sale-from-report-confirm'){
    const rid = document.getElementById('sale-start-report').value;
    closeModal();
    if(!rid){ toast('Selecione um relatório.'); return; }
    saleDraft = saleDraftFromReport(rid);
    editingDraft=true; render(); return;
  }
  if(action==='cancel-sale'){ saleDraft=null; editingDraft=false; render(); return; }
  if(action==='sale-add-product'){ return; }
  if(action==='sale-item-rm'){ saleDraft.itens.splice(+btn.dataset.idx,1); render(); return; }
  if(action==='sale-desconto-toggle'){ saleDraft.temDesconto = btn.dataset.v==='true'; render(); return; }
  if(action==='save-sale'){
    const subtotal = saleDraft.itens.reduce((s,i)=>s+i.valorUnit*i.qtd,0);
    const desconto = saleDraft.temDesconto? Math.min(saleDraft.desconto||0, subtotal) : 0;
    const total = subtotal - desconto;
    await db.collection('sales').add({...saleDraft, desconto, total});
    saleDraft=null; editingDraft=false; toast('Venda registrada!'); render(); return;
  }
  if(action==='delete-sale'){ confirmDialog('Excluir esta venda?', async ()=>{ await db.collection('sales').doc(btn.dataset.id).delete(); }); return; }
  if(action==='sale-to-fin'){
    const s = STATE.sales.find(x=>x.id===btn.dataset.id);
    await db.collection('transactions').add({tipo:'entrada', descricao:'Venda — '+(clientName(s.clienteId)||s.clienteNome||'cliente avulso'), valor:s.total, data:s.data, categoria:'Venda', formaPagamento:s.formaPagamento||''});
    toast('Lançado no financeiro!'); return;
  }

  // agenda
  if(action==='new-appt'){ openModal(apptModalHtml(null)); bindApptServicoSync(); return; }
  if(action==='edit-appt'){ const rec = STATE.appointments.find(x=>x.id===btn.dataset.id); openModal(apptModalHtml(rec)); bindApptServicoSync(); return; }
  if(action==='delete-appt'){ confirmDialog('Excluir este agendamento?', async ()=>{ await db.collection('appointments').doc(btn.dataset.id).delete(); }); return; }
  if(action==='copy-confirm'){ const a = STATE.appointments.find(x=>x.id===btn.dataset.id); copyText(apptMsgConfirmacao(a)); return; }
  if(action==='copy-lembrete'){ const a = STATE.appointments.find(x=>x.id===btn.dataset.id); copyText(apptMsgLembrete(a)); return; }
  if(action==='toggle-past'){ uiState.agendaShowPast = !uiState.agendaShowPast; render(); return; }

  // orçamentos
  if(action==='new-budget'){ budgetDraft = newBudgetDraft(); editingDraft=true; render(); return; }
  if(action==='cancel-budget'){ budgetDraft=null; editingDraft=false; render(); return; }
  if(action==='budget-modo'){ budgetDraft.modo = btn.dataset.v; budgetDraft.itens=[]; render(); return; }
  if(action==='budget-add-catalogo'){ return; }
  if(action==='budget-add-aberto'){
    const desc = document.getElementById('item-desc-aberto').value.trim();
    const val = parseFloat(document.getElementById('item-valor-aberto').value||0);
    if(!desc || !val) return;
    budgetDraft.itens.push({descricao:desc, valor:val, qtd:1}); render(); return;
  }
  if(action==='budget-item-rm'){ budgetDraft.itens.splice(+btn.dataset.idx,1); render(); return; }
  if(action==='save-budget'){
    const total = budgetDraft.itens.reduce((s,i)=>s+i.valor*i.qtd,0);
    const numero = await nextBudgetNumber();
    await db.collection('budgets').add({...budgetDraft, total, numero});
    budgetDraft=null; editingDraft=false; toast('Orçamento salvo!'); render(); return;
  }
  if(action==='print-budget'){ printBudget(btn.dataset.id); return; }
  if(action==='delete-budget'){ confirmDialog('Excluir este orçamento?', async ()=>{ await db.collection('budgets').doc(btn.dataset.id).delete(); }); return; }
  if(action==='report-from-budget'){ uiState.tab='relatorios'; uiState.reportSub='realizado'; reportDraft = newReportDraft(btn.dataset.id); editingDraft=true; render(); return; }

  // relatório serviço realizado
  if(action==='new-report'){ openModal(reportStartModalHtml()); return; }
  if(action==='report-start-confirm'){
    const bid = document.getElementById('report-start-budget').value;
    closeModal();
    reportDraft = newReportDraft(bid||undefined);
    editingDraft=true; render(); return;
  }
  if(action==='cancel-report'){ reportDraft=null; editingDraft=false; render(); return; }
  if(action==='report-prev-toggle'){ reportDraft.itensPrevistos[+btn.dataset.idx].checked = btn.dataset.v==='true'; render(); return; }
  if(action==='report-add-extra'){
    const desc = document.getElementById('extra-desc').value.trim();
    const val = parseFloat(document.getElementById('extra-valor').value||0);
    if(!desc||!val) return;
    reportDraft.itensExtras.push({descricao:desc, valor:val}); render(); return;
  }
  if(action==='report-extra-rm'){ reportDraft.itensExtras.splice(+btn.dataset.idx,1); render(); return; }
  if(action==='report-toggle-cond'){
    const v = btn.dataset.v;
    const i = reportDraft.condicoes.indexOf(v);
    if(i>=0) reportDraft.condicoes.splice(i,1); else reportDraft.condicoes.push(v);
    render(); return;
  }
  if(action==='save-report'){ await db.collection('serviceReports').add({...reportDraft}); reportDraft=null; editingDraft=false; toast('Relatório salvo!'); render(); return; }
  if(action==='print-report'){ printReport(btn.dataset.id); return; }
  if(action==='delete-report'){ confirmDialog('Excluir este relatório?', async ()=>{ await db.collection('serviceReports').doc(btn.dataset.id).delete(); }); return; }

  // relatório fotográfico
  if(action==='new-photo'){ photoDraft = newPhotoDraft(); editingDraft=true; render(); return; }
  if(action==='cancel-photo'){ photoDraft=null; editingDraft=false; render(); return; }
  if(action==='photo-toggle-servico'){
    const id = btn.dataset.id; const i = photoDraft.servicosFeitos.indexOf(id);
    if(i>=0) photoDraft.servicosFeitos.splice(i,1); else photoDraft.servicosFeitos.push(id);
    return;
  }
  if(action==='photo-pick'){ document.getElementById('photo-file-input').click(); return; }
  if(action==='photo-rm'){ photoDraft.fotos.splice(+btn.dataset.idx,1); render(); return; }
  if(action==='save-photo'){
    const size = JSON.stringify(photoDraft.fotos).length;
    if(size > 230000){ toast('Relatório muito grande — remova uma foto.'); return; }
    await db.collection('photoReports').add({...photoDraft});
    photoDraft=null; editingDraft=false; toast('Relatório fotográfico salvo!'); render(); return;
  }
  if(action==='print-photo'){ printPhoto(btn.dataset.id); return; }
  if(action==='delete-photo'){ confirmDialog('Excluir este relatório?', async ()=>{ await db.collection('photoReports').doc(btn.dataset.id).delete(); }); return; }

  // checklist
  if(action==='new-checklist'){ checklistDraft = newChecklistDraft(); editingDraft=true; render(); return; }
  if(action==='cancel-checklist'){ checklistDraft=null; editingDraft=false; render(); return; }
  if(action==='checklist-item-toggle'){ checklistDraft.itens[btn.dataset.key] = btn.dataset.v==='true'; render(); return; }
  if(action==='clear-signature'){ const c=document.getElementById('sig-canvas'); c.getContext('2d').clearRect(0,0,c.width,c.height); checklistDraft.assinaturaDataUrl=''; return; }
  if(action==='save-checklist'){ await db.collection('checklists').add({...checklistDraft}); checklistDraft=null; editingDraft=false; toast('Checklist salvo!'); render(); return; }
  if(action==='print-checklist'){ printChecklist(btn.dataset.id); return; }
  if(action==='delete-checklist'){ confirmDialog('Excluir este checklist?', async ()=>{ await db.collection('checklists').doc(btn.dataset.id).delete(); }); return; }
});

document.addEventListener('change', async (e)=>{
  const el = e.target;

  if(el.dataset.action==='fin-month'){ uiState.finMonth = el.value; render(); return; }
  if(el.dataset.action==='appt-status'){ await db.collection('appointments').doc(el.dataset.id).update({status:el.value}); return; }
  if(el.dataset.action==='budget-status'){ await db.collection('budgets').doc(el.dataset.id).update({status:el.value}); return; }
  if(el.dataset.action==='budget-item-qtd'){ budgetDraft.itens[+el.dataset.idx].qtd = Math.max(1, parseInt(el.value||1)); render(); return; }
  if(el.dataset.action==='budget-item-valor'){ budgetDraft.itens[+el.dataset.idx].valor = parseFloat(el.value||0); render(); return; }
  if(el.dataset.action==='sale-item-qtd'){ saleDraft.itens[+el.dataset.idx].qtd = Math.max(1, parseInt(el.value||1)); render(); return; }
  if(el.dataset.action==='sale-desconto-valor'){ saleDraft.desconto = parseFloat(el.value||0); render(); return; }

  if(el.dataset.action==='budget-add-catalogo' && el.value){
    const s = STATE.services.find(x=>x.id===el.value);
    if(s) budgetDraft.itens.push({descricao:s.nome, valor:s.preco, qtd:1, servicoId:s.id});
    el.value=''; render(); return;
  }
  if(el.dataset.action==='sale-add-product' && el.value){
    const p = STATE.products.find(x=>x.id===el.value);
    if(p) saleDraft.itens.push({tipo:'produto', refId:p.id, nome:p.nome, valorUnit:p.preco, qtd:1});
    el.value=''; render(); return;
  }
  if(el.dataset.action==='sale-add-service' && el.value){
    const s = STATE.services.find(x=>x.id===el.value);
    if(s) saleDraft.itens.push({tipo:'servico', refId:s.id, nome:s.nome, valorUnit:s.preco, qtd:1});
    el.value=''; render(); return;
  }

  if(el.dataset.liveInput==='crud-search'){ uiState.crudSearch[el.dataset.entity] = el.value; render(); return; }
  if(el.dataset.liveInput==='sale-cliente'){ saleDraft.clienteId = el.value; render(); return; }
  if(el.dataset.liveInput==='sale-cliente-nome'){ saleDraft.clienteNome = el.value; return; }
  if(el.dataset.liveInput==='sale-data'){ saleDraft.data = el.value; return; }
  if(el.dataset.liveInput==='sale-pagamento'){ saleDraft.formaPagamento = el.value; return; }
  if(el.dataset.liveInput==='sale-obs'){ saleDraft.obs = el.value; return; }

  if(el.dataset.liveInput==='budget-cliente'){ budgetDraft.clienteId = el.value; return; }
  if(el.dataset.liveInput==='budget-data'){ budgetDraft.data = el.value; return; }
  if(el.dataset.liveInput==='budget-validade'){ budgetDraft.validadeDias = parseInt(el.value||15); return; }
  if(el.dataset.liveInput==='budget-obs'){ budgetDraft.obs = el.value; return; }

  if(el.dataset.liveInput==='report-cliente'){ reportDraft.clienteId = el.value; return; }
  if(el.dataset.liveInput==='report-data'){ reportDraft.data = el.value; return; }
  if(el.dataset.liveInput==='report-obs'){ reportDraft.obs = el.value; return; }

  if(el.dataset.liveInput==='photo-cliente'){ photoDraft.clienteId = el.value; return; }
  if(el.dataset.liveInput==='photo-data'){ photoDraft.data = el.value; return; }
  if(el.dataset.liveInput==='photo-obs'){ photoDraft.obs = el.value; return; }

  if(el.dataset.liveInput==='checklist-cliente'){ checklistDraft.clienteId = el.value; return; }
  if(el.dataset.liveInput==='checklist-data'){ checklistDraft.data = el.value; return; }
  if(el.dataset.liveInput==='checklist-ativo'){ checklistDraft.ativo = el.value; return; }
  if(el.dataset.liveInput==='checklist-info'){ checklistDraft.infoServico = el.value; return; }
  if(el.dataset.liveInput==='checklist-diagnostico'){ checklistDraft.diagnostico = el.value; return; }
  if(el.dataset.liveInput==='checklist-tecnico'){ checklistDraft.tecnico = el.value; return; }

  if(el.id==='logo-file-input'){
    const file = el.files[0];
    if(file){ const dataUrl = await compressImage(file); await saveEmpresa({logoDataUrl:dataUrl}); render(); }
    return;
  }
  if(el.id==='photo-file-input'){
    for(const file of el.files){
      const dataUrl = await compressImage(file);
      photoDraft.fotos.push({dataUrl, legenda:''});
    }
    render(); return;
  }
});

document.addEventListener('input', (e)=>{
  const el = e.target;
  if(el.dataset.liveInput==='crud-search'){ uiState.crudSearch[el.dataset.entity] = el.value; render(); return; }
  if(el.dataset.action==='photo-legenda'){ photoDraft.fotos[+el.dataset.idx].legenda = el.value; return; }
  if(el.dataset.liveInput==='sale-cliente-nome'){ saleDraft.clienteNome = el.value; return; }
  if(el.dataset.liveInput==='sale-obs'){ saleDraft.obs = el.value; return; }
  if(el.dataset.liveInput==='budget-obs'){ budgetDraft.obs = el.value; return; }
  if(el.dataset.liveInput==='report-obs'){ reportDraft.obs = el.value; return; }
  if(el.dataset.liveInput==='photo-obs'){ photoDraft.obs = el.value; return; }
  if(el.dataset.liveInput==='checklist-ativo'){ checklistDraft.ativo = el.value; return; }
  if(el.dataset.liveInput==='checklist-info'){ checklistDraft.infoServico = el.value; return; }
  if(el.dataset.liveInput==='checklist-diagnostico'){ checklistDraft.diagnostico = el.value; return; }
  if(el.dataset.liveInput==='checklist-tecnico'){ checklistDraft.tecnico = el.value; return; }
});

document.addEventListener('submit', async (e)=>{
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const type = form.dataset.form;
  if(type==='entity') await handleEntityForm(form);
  else if(type==='tx') await handleTxForm(form);
  else if(type==='appt') await handleApptForm(form);
  else if(type==='empresa'){
    const fd = new FormData(form);
    await saveEmpresa({nome:fd.get('nome'), slogan:fd.get('slogan'), endereco:fd.get('endereco'), whatsapp1:fd.get('whatsapp1'), whatsapp2:fd.get('whatsapp2'), instagram:fd.get('instagram'), garantiaDias:parseInt(fd.get('garantiaDias')||90)});
    toast('Dados da empresa atualizados!');
  }
});

function bindTxToggle(){
  document.querySelectorAll('#tx-type-toggle button').forEach(b=>{
    b.onclick = ()=>{
      const form = modalContent.querySelector('form[data-form="tx"]');
      const fd = new FormData(form);
      const updated = {
        id: form.dataset.id, tipo: b.dataset.v,
        descricao: fd.get('descricao')||'', valor: fd.get('valor')||'', data: fd.get('data')||todayStr(),
        categoria: '', formaPagamento: fd.get('formaPagamento')||'Pix', status: fd.get('status')||'Pago'
      };
      openModal(txModalHtml(updated));
      bindTxToggle();
    };
  });
}
function bindApptServicoSync(){
  const sel = document.getElementById('appt-servico-select');
  const desc = document.getElementById('appt-servico-desc');
  if(!sel) return;
  sel.addEventListener('change', ()=>{
    const s = STATE.services.find(x=>x.id===sel.value);
    if(s) desc.value = s.nome;
  });
}

/* ============================================================
   INÍCIO
============================================================ */
renderBrand();
render();
initTheme();
initDb();
initDownloads();
</script>
